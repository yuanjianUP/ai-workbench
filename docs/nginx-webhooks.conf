# 在 nginx 的 http 块中包含此文件；替换证书路径并设置访问权限。
# nginx worker 必须能访问服务的 0600 socket，通常需要与服务使用相同用户。
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/ai-workbench/tls.crt;
    ssl_certificate_key /etc/ai-workbench/tls.key;
    client_max_body_size 16k;

    location = /webhooks/github {
        proxy_set_header Host $host;
        proxy_pass http://unix:/run/ai-workbench/service.sock:;
    }

    location = /webhooks/feishu {
        proxy_set_header Host $host;
        proxy_pass http://unix:/run/ai-workbench/service.sock:;
    }

    location / { return 404; }
}
